<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Eduardo Nunes</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#030305">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/portfolio.css">
</head>
<body>
  <header class="nav"><a class="logo" href="/">EN<i>.</i></a></header>
  <main>
    <section class="scene">
      <div class="kicker plain"><span class="label">Erro 404</span></div>
      <h1 class="big md"><span class="ln"><span>Página não</span></span><span class="ln"><span><em>encontrada</em>.</span></span></h1>
      <p class="lede">O endereço pode ter mudado ou nunca ter existido.</p>
      <div class="actions"><a class="tl" href="/">Voltar para o início</a></div>
    </section>
  </main>
  <script>
    try {
      var l = localStorage.getItem("lang") || (/^pt/i.test(navigator.language || "pt") ? "pt" : "en");
      if (l === "en") {
        document.documentElement.lang = "en";
        document.title = "Page not found | Eduardo Nunes";
        var s = document.querySelectorAll(".label, .ln span, .lede, .actions a");
        var t = ["Error 404", "Page not", "<em>found</em>.", "The address may have changed or never existed.", "Back to home"];
        for (var i = 0; i < s.length && i < t.length; i++) s[i].innerHTML = t[i];
      }
    } catch (e) {}
  </script>
</body>
</html>
